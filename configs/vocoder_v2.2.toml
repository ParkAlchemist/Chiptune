schema_version = 1

[run]
experiment_name = "v2.2"
output_root = "runs/vocoder_cqt"
seed = 1337
device = "cuda"

[data]
chip_cache_root = "C:/Datasets/cache/cqt/cqt116_sr44100_hop256_bpo12_fminA0/chip"
sample_rate = 44100
hop_length = 256
cqt_bins = 116
bins_per_octave = 12
fmin = 27.5

segment_frames = 128
windows_per_track = 8
batch_size = 4
num_workers = 4
cache_waveforms = 16
pin_memory = true
persistent_workers = true
prefetch_factor = 2
random_window = true
drop_last = true

[generator]
activation = "snake_beta"
upsample_initial_channel = 256
upsample_rates = [8, 4, 4, 2]
upsample_kernel_sizes = [16, 8, 8, 4]
resblock_kernel_sizes = [3, 7, 15]
resblock_dilation_sizes = [
    [1, 3, 5],
    [1, 3, 5],
    [1, 3, 5],
]
final_tanh = true
use_weight_norm = true

[generator.snake_beta]
alpha_logscale = true
alpha_initial = 1.0
beta_initial = 1.0

[generator.alias_free]
enabled = true
implementation = "pytorch"
upsample_ratio = 2
downsample_ratio = 2
upsample_kernel_size = 12
downsample_kernel_size = 12

[generator.eca]
enabled = true
kernel_size = 0
gamma = 2.0
beta = 1.0
minimum_kernel_size = 3
residual = false

[generator.context]
enabled = true
number_of_blocks = 4
block_type = "multi_kernel_convnext"
kernel_size = 7
dilation = 1
multi_kernel_sizes = [3, 7, 15, 31]
multi_kernel_dilations = [1, 1, 1, 1]
expansion_ratio = 4
layer_scale_initial = 1e-6
use_grn = true
grn_eps = 1e-6

[generator.context.attention]
enabled = true
placement = 2
number_of_heads = 8
dropout = 0.0
rope_base = 10000.0
layer_scale_initial = 1e-4
qkv_bias = true
output_bias = true

[discriminator]
use_mpd = true
use_msd = false
use_mrd = true

[discriminator.mpd]
periods = [2, 3, 5, 7, 11]
channels = [16, 64, 256, 512, 512]
kernel_size = 5
stride = 3

[discriminator.msd]
num_scales = 3
first_discriminator_norm = "spectral"
other_discriminator_norm = "weight"
pool_kernel_size = 4
pool_stride = 2
pool_padding = 2

[discriminator.msd.discriminator]
channels = [128, 128, 256, 512, 1024, 1024]
kernel_sizes = [15, 41, 41, 41, 41, 5]
strides = [1, 2, 2, 4, 4, 1]
groups = [1, 4, 16, 16, 16, 16]
norm = "weight"
negative_slope = 0.2

[discriminator.mrd]
resolutions = [
    [128, 32, 128],
    [256, 64, 256],
    [512, 128, 512],
    [1024, 256, 1024],
    [2048, 512, 2048],
]

[discriminator.mrd.discriminator]
channels = [32, 64, 128, 256, 512]
kernel_sizes = [
    [3, 9],
    [3, 9],
    [3, 9],
    [3, 3],
    [3, 3],
]
strides = [
    [1, 2],
    [2, 2],
    [2, 2],
    [2, 1],
    [1, 1],
]
norm = "weight"
negative_slope = 0.2
eps = 1e-8
magnitude_compression = "log1p"

[loss]
lambda_adversarial = 1.0
lambda_feature_matching = 2.0
lambda_mrstft = 2.5
lambda_waveform = 0.5
lambda_temporal_gradient = 0.5
lambda_rms_envelope = 0.0
lambda_band_power = 0.0

[loss.mrstft]
fft_sizes = [128, 256, 512, 1024, 2048]
hop_sizes = [32, 64, 128, 256, 512]
win_lengths = [128, 256, 512, 1024, 2048]
spectral_convergence_weight = 1.0
log_magnitude_weight = 1.0
eps = 1e-5

[loss.feature_matching]
normalization = "real_magnitude"
scale_floor = 1e-2
eps = 1e-8

[loss.temporal_gradient]
enabled = true
lags = [1, 2, 4]
normalization = "none"
scale_floor = 1e-3
eps = 1e-8
edge_weighting = false
edge_weight = 1.0
max_edge_weight = 5.0

[loss.rms_envelope]
enabled = false
window_sizes = [64, 256, 1024, 4096]
hop_ratio = 4
eps = 1e-8

[loss.band_power]
enabled = false

fft_sizes = [1024, 4096]
hop_sizes = [256, 1024]
win_lengths = [1024, 4096]

number_of_bands = 24

fmin = 27.5
fmax = 22050.0

absolute_weight = 1.0
shape_weight = 1.0

eps = 1e-8

[optimizer.generator]
name = "adamw"
lr = 0.0002
beta1 = 0.8
beta2 = 0.99
weight_decay = 0.0
eps = 1e-8

[optimizer.discriminator]
name = "adamw"
lr = 0.0001
beta1 = 0.8
beta2 = 0.99
weight_decay = 0.0
eps = 1e-8

[scheduler.generator]
name = "cosine"
enabled = true
gamma = 0.999
interval = "optimizer_step"
t_max = 500000
eta_min = 2e-5

[scheduler.discriminator]
name = "cosine"
enabled = true
gamma = 0.999
interval = "optimizer_step"
t_max = 500000
eta_min = 1e-5

[training]
epochs = 500
gradient_accumulation_steps = 2
grad_clip_generator = 10.0
grad_clip_discriminator = 10.0

generator_start_step = 0
discriminator_start_step = 0
adversarial_start_step = 0

overfit_batches = 0
detect_anomaly = false
fail_on_nonfinite = true

[amp]
enabled = false
start_step = 0
dtype = "float16"
initial_scale = 256.0
growth_interval = 2000

[augmentation]
enabled = false
gain_db_min = 0.0
gain_db_max = 0.0
conditioning_noise_std = 0.0
time_mask_probability = 0.0
frequency_mask_probability = 0.0

[logging]
log_every_steps = 50
status_every_steps = 50
save_every_steps = 5000
preview_every_steps = 10000
preview_num_samples = 4
keep_numbered_checkpoints = 10
tensorboard = true

[control]
enabled = true
poll_every_steps = 10
save_on_interrupt = true

