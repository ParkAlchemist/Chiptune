[paths]
chip_cache_root = "C:/Datasets/cache/cqt/cqt96_sr22050_hop512/chip"
output_root = "runs/vocoder_cqt"
experiment_name = "cqt96_hifigan_v1_snake_beta"

[data]
sample_rate = 22050
hop_length = 512
cqt_bins = 96
segment_frames = 32
windows_per_track = 8
batch_size = 2
num_workers = 1
cache_waveforms = 8

[training]
epochs = 50
max_steps = 2000000
lr_g = 0.0002
lr_d = 0.0002
beta1 = 0.8
beta2 = 0.99
grad_clip_norm = 10.0
seed = 1337
device = "cuda"

[losses]
lambda_adv = 1.0
lambda_feature_matching = 2.0
lambda_mrstft = 45.0

[model]
activation = "snake_beta"
upsample_initial_channel = 128
discriminator_size = "small"

[amp]
amp = false
amp_start_step = 1000
amp_init_scale = 256.0

[logging]
log_every_steps = 50
save_every_steps = 10000
preview_every_steps = 10000
preview_num_samples = 4

