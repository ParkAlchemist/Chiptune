schema_version = 1

[run]
experiment_name = "loader_test"
output_root = "runs/vocoder_cqt"
seed = 1337
device = "cuda"

[data]
chip_cache_root = "C:/Datasets/cache/cqt/cqt96_sr22050_hop512/chip"
sample_rate = 22050
hop_length = 512
cqt_bins = 96
bins_per_octave = 12
fmin = 32.70319566

segment_frames = 32
windows_per_track = 8
batch_size = 2
num_workers = 1
cache_waveforms = 8

pin_memory = true
persistent_workers = true
prefetch_factor = 2
random_window = true
drop_last = true

[generator]
activation = "snake_beta"
upsample_initial_channel = 128
upsample_rates = [8, 8, 4, 2]
upsample_kernel_sizes = [16, 16, 8, 4]
resblock_kernel_sizes = [3, 7, 11]
resblock_dilation_sizes = [
    [1, 3, 5],
    [1, 3, 5],
    [1, 3, 5],
]
final_tanh = true
use_weight_norm = true

[generator.snake_beta]
alpha_logscale = true
alpha_initial = 1.0
beta_initial = 1.0

[generator.alias_free]
enabled = false
implementation = "pytorch"
upsample_ratio = 2
downsample_ratio = 2
upsample_kernel_size = 12
downsample_kernel_size = 12

[discriminator]
preset = "custom"
use_mpd = true
use_msd = true

[discriminator.mpd]
periods = [2, 3, 5, 7, 11]
channels = [16, 64, 256, 512, 512]
kernel_size = 5
stride = 3
norm = "weight"
negative_slope = 0.2

[discriminator.msd]
num_scales = 3
first_discriminator_norm = "spectral"
other_discriminator_norm = "weight"
pool_kernel_size = 4
pool_stride = 2
pool_padding = 2

[discriminator.msd.discriminator]
channels = [128, 128, 256, 512, 1024, 1024]
kernel_sizes = [5, 41, 41, 41, 41, 5]
strides = [1, 2, 2, 4, 4, 1]
groups = [1, 4, 16, 16, 16, 16]
norm = "weight"
negative_slope = 0.2

[loss]
lambda_adversarial = 1.0
lambda_feature_matching = 2.0
lambda_mrstft = 45.0

[loss.mrstft]
fft_sizes = [256, 512, 1024, 2048]
hop_sizes = [64, 128, 256, 512]
win_lengths = [256, 512, 1024, 2048]
spectral_convergence_weight = 1.0
log_magnitude_weight = 1.0
eps = 0.0000001

[optimizer.generator]
name = "adamw"
lr = 0.0002
weight_decay = 0.0
beta1 = 0.8
beta2 = 0.99
eps = 0.00000001

[optimizer.discriminator]
name = "adamw"
lr = 0.0002
weight_decay = 0.0
beta1 = 0.8
beta2 = 0.99
eps = 0.00000001

[scheduler.generator]
name = "exponential"
enabled = false
gamma = 0.999

[scheduler.discriminator]
name = "exponential"
enabled = false
gamma = 0.999

[training]
epochs = 500
max_steps = 2000000
gradient_accumulation_steps = 1

grad_clip_generator = 10.0
grad_clip_discriminator = 10.0

generator_start_step = 0
discriminator_start_step = 0
adversarial_start_step = 0

overfit_batches = 0
detect_anomaly = false
fail_on_nonfinite = true

[amp]
enabled = false
start_step = 0
dtype = "float16"
initial_scale = 256.0
growth_interval = 2000

[augmentation]
enabled = false
gain_db_min = 0.0
gain_db_max = 0.0
conditioning_noise_std = 0.0
time_mask_probability = 0.0
frequency_mask_probability = 0.0

[logging]
log_every_steps = 50
status_every_steps = 50
save_every_steps = 10000
preview_every_steps = 10000
validation_every_steps = 10000
preview_num_samples = 4
validation_num_samples = 16
keep_numbered_checkpoints = 10
tensorboard = true

[control]
enabled = true
poll_every_steps = 10
save_on_interrupt = true

